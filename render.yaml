services:
  - type: web
    name: jd-copy-generator
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8000"
      - key: DEBUG
        value: "false"
      - key: MAX_FILE_SIZE_MB
        value: "10"
    healthCheckPath: /api/health
    plan: free
